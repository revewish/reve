<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>11:11 — لجوري</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#070817;--fg:#f4ecff;--gold:#ffd98a;--pink:#ff7eb6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Cairo,Tahoma,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;z-index:0}
.layer{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity 1.2s;padding:20px}
.hide{opacity:0;pointer-events:none}
#clock{font-size:clamp(64px,22vw,140px);font-weight:900;color:var(--gold);text-shadow:0 0 30px #ffb84d,0 0 80px #ff7eb6;animation:pulse 2.4s infinite;cursor:pointer;letter-spacing:4px;direction:ltr}
@keyframes pulse{50%{transform:scale(1.06);text-shadow:0 0 50px #ffb84d,0 0 120px #ff7eb6}}
.hint{opacity:.8;margin-top:14px;font-size:18px}
#couple{font-size:64px;animation:pulse 2s infinite}
#sky{pointer-events:none}
#title{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);width:100%;text-align:center;z-index:3;font-weight:700;color:var(--gold);text-shadow:0 0 12px #000;transition:opacity 1s}
.star{position:fixed;z-index:3;width:58px;height:58px;margin:-29px 0 0 -29px;border:0;background:none;font-size:46px;cursor:pointer;filter:drop-shadow(0 0 10px #ffd98a);animation:tw 2.2s infinite;color:var(--gold);transition:all 1s}
.star.lit{filter:drop-shadow(0 0 16px #ff7eb6);animation:none;opacity:.55}
@keyframes tw{50%{transform:scale(1.25) rotate(12deg)}}
.n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 19px Cairo,sans-serif;color:#2a0a1c;padding-top:4px}
#card{position:fixed;z-index:5;left:0;right:0;bottom:0;max-height:78%;padding:22px 22px calc(env(safe-area-inset-bottom,0px) + 22px);background:rgba(18,14,44,.9);backdrop-filter:blur(8px);border-radius:26px 26px 0 0;border-top:1px solid #ffd98a55;transform:translateY(110%);transition:transform .7s;overflow:auto}
#card.on{transform:none}
#card h3{margin:0 0 10px;color:var(--pink);font-size:20px}
#txt{font-size:20px;line-height:2;min-height:120px;white-space:pre-wrap}
#next{margin-top:14px;padding:10px 26px;border-radius:30px;border:1px solid var(--gold);background:none;color:var(--gold);font:700 17px Cairo,sans-serif;opacity:0;transition:.5s;cursor:pointer}
#next.on{opacity:1}
#end{z-index:4}
#end p{font-size:clamp(20px,5vw,28px);line-height:2;max-width:560px;margin:0 0 18px;text-shadow:0 0 14px #000}
#wish{padding:14px 34px;border-radius:40px;border:0;background:linear-gradient(135deg,#ff7eb6,#ffb84d);color:#2a0a1c;font:900 20px Cairo,sans-serif;cursor:pointer;box-shadow:0 0 30px #ff7eb688}
#music{position:fixed;z-index:6;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);font-size:22px;background:none;border:0;color:var(--fg);cursor:pointer;opacity:.7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<audio id="aud" src="k.mp3" loop preload="auto"></audio>
<input type="file" id="pick" accept="audio/*" hidden>
<button id="music" title="موسيقى">🎵</button>

<div id="intro" class="layer">
  <div id="clock">11:11</div>
  <div class="hint" id="hint">فكراااني نسييت   .. دوسي ✨</div>
</div>

<div id="title" class="hide">دوسي على النجوم بالترتيب من ١ لـ ٧ ✨</div>
<div id="stars"></div>

<div id="card"><h3 id="ct"></h3><div id="txt"></div><button id="next">كمّلي ♡</button></div>

<div id="end" class="layer hide">
  <p id="endtxt"></p>
  <button id="wish"> اتمنّي أمنيتك يجرجوره 🌠</button>
</div>

<script>
const $=id=>document.getElementById(id);
const cv=$('c'),x=cv.getContext('2d');let W,H;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);

const CH=[
{t:'أول نجمة',m:'hearts',p:[22,24],s:'هاي يحبيبتي\nعارف اننا زعلانين من بعض دلوقتي بس برضو لازم الحق اكتب رسالتي قبل ما اليوم يخلص\nمهما كان ايه اللي بيحصل بيننا دلوقتي انا بحبك'},
{t:'نجمة الوعد',m:'stars',p:[74,20],s:'وحتا لو حصلي حاجه انا بحبك ومش هحب غيرك ولا حتا هعرف احب غيرك يجوري\nدا انا بتمنى من ربنا اني اتجوزك ف الجنه بدل حور العين\nانا مش عايز غيرك في دنيتي واخرتي\nانا مش عايز غيرك ف حياتي ي حبيبتي'},
{t:'نجمة الحلم',m:'lan',p:[40,40],s:'ونفسي بجد نكمل لاخر سنه ف سني ونعيش حياتنا سوا اللي حلمنا بيها\nبيتنا اللي قلنا اننا هنعمله وعيالنا اللي قلنا اساميهم وقولنا ان شاء الله نربيهم احسن تربيه\nحتا تجاربنا وسفرنا\nكل حاجه عايزين بس نتجوز'},
{t:'نجمة الملكة',m:'gold',p:[80,48],s:'وبعدها والله هعيشك ملكه يجوري\nهخلي صحابك يغيرو منك وهتشوفي دا بعينك\nلما نكبر لما تقولي فعين صحابك كلهم اننا بقالنا سنين عايشين مع بعض من واحنا اطفال'},
{t:'نجمة الطفولة',m:'fly',p:[18,58],s:'حرفيا مش مراهقين حتا\nوعلمنا بعض يعني ايه حب\nوعلمنا بعض ازاي تفهم الشخص الثاني دا وتحسسه بالامان\nمن خبره صفر ل كابلز بيستحمو مع بعض 😭😭😭'},
{t:'نجمة التعويض',m:'petals',p:[62,68],s:'والله انا هخليكي تتبسطي علي الانتظار اللي ليا دا كله\nالانتظار اللي انتي وعدتيني انك هتستنيهوني انا هعوضهولك\nوهخليكي تنسي السنين اللي فضلنا فيها نحب بعض من ورا اهالينا\nوهحبك قدام اهلك\nمش صحابك بس اللي هيغيرو\nانا هخليي اخواتك نفسهم يغيرو بقا\nهعملك مشاكل اسريه مش مشكلتي انا بقا احم احم'},
{t:'آخر نجمة',m:'rain',p:[38,82],s:'وبس كدا حبيت افكرك بمناسبه 11.11\nانك غاليه عندي\nوانك مهما زعلتيني او مهما زعلتك او زعلنا من بعض\nلسا برضو بحبك زي اول مره اشوفك فيها'}
];
const SETS={hearts:['💗','💕','❤️'],stars:['✨','⭐','🌟'],fly:['🦋','✨'],petals:['🌸','🌹'],lan:['🏮','✨'],gold:['👑','✨','💍'],rain:['💫','💖','✨'],burst:['💖','💗','💕','❤️','🌠']};
const DOWN={petals:1,rain:1,stars:1};

const bg=[...Array(140)].map(()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.5,p:Math.random()*6,tx:0,ty:0}));
{const sc=Math.min(innerWidth,innerHeight*.8)/38;bg.forEach((b,i)=>{const a=i/bg.length*Math.PI*2;b.hx=16*Math.pow(Math.sin(a),3);b.hy=13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a)});}
let mode=null,parts=[],finale=0,going=false,tt=0;

function spawn(m,px,py,burst){const e=SETS[m];const dn=DOWN[m];
  parts.push({x:px??Math.random()*W,y:py??(dn?-20:H+20),s:14+Math.random()*20,v:(.6+Math.random()*1.4)*(dn?1:-1),vx:burst?(Math.random()-.5)*9:0,vy:burst?(Math.random()-.5)*9:0,d:Math.random()*6,e:e[Math.random()*e.length|0],a:1,b:burst});}

function loop(){tt+=.02;x.clearRect(0,0,W,H);
  const sc=Math.min(W,H*.8)/38;
  bg.forEach(b=>{let px=b.x*W,py=b.y*H;
    if(finale>0){px+=(W/2+b.hx*sc-px)*finale;py+=(H*.36-b.hy*sc-py)*finale}
    x.globalAlpha=.5+.5*Math.sin(tt*2+b.p);x.fillStyle=finale>0?'#ffd9ec':'#fff';
    x.beginPath();x.arc(px,py,b.r*(1+finale*.6),0,7);x.fill();});
  if(going&&finale<1)finale=Math.min(1,finale+.008);
  x.globalAlpha=1;
  if(mode&&Math.random()<.18)spawn(mode);
  parts=parts.filter(p=>p.a>0&&p.y>-40&&p.y<H+40);
  parts.forEach(p=>{if(p.b){p.x+=p.vx;p.y+=p.vy;p.a-=.012}else{p.y+=p.v;p.x+=Math.sin(tt*2+p.d)*.8}
    x.globalAlpha=Math.max(p.a,0);x.font=p.s+'px serif';x.fillText(p.e,p.x,p.y)});
  x.globalAlpha=1;requestAnimationFrame(loop)}
loop();

// music
const aud=$('aud');
$('music').onclick=()=>{aud.paused?aud.play().catch(()=>$('pick').click()):aud.pause()};
$('pick').onchange=e=>{const f=e.target.files[0];if(f){aud.src=URL.createObjectURL(f);aud.play()}};

// intro
let started=false;
$('clock').onclick=()=>{if(started)return;started=true;aud.play().catch(()=>{});
  $('clock').style.animation='none';
  $('clock').outerHTML='<div id="couple">🧍🏻‍♂️💞🧍🏻‍♀️</div>';
  $('hint').textContent='حمودي وريري ♡';mode='hearts';
  setTimeout(()=>{$('intro').classList.add('hide');mode=null;$('title').classList.remove('hide');buildStars()},2600)};

let lit=0;
function buildStars(){const box=$('stars');
  CH.forEach((c,i)=>{const b=document.createElement('button');b.className='star';b.innerHTML='★<span class="n">'+(i+1)+'</span>';
    b.style.left=c.p[0]+'%';b.style.top=c.p[1]+'%';b.style.animationDelay=(i*.3)+'s';
    b.onclick=()=>openCh(i,b);box.appendChild(b)})}

let timer=null,cur=null;
function openCh(i,btn){if(cur!==null)return;cur=btn;const c=CH[i];mode=c.m;
  $('ct').textContent=c.t;$('txt').textContent='';$('next').classList.remove('on');$('card').classList.add('on');
  let k=0;const s=c.s;clearInterval(timer);
  timer=setInterval(()=>{k++;$('txt').textContent=s.slice(0,k);if(k>=s.length){clearInterval(timer);$('next').classList.add('on')}},38);
  $('txt').onclick=()=>{clearInterval(timer);$('txt').textContent=s;$('next').classList.add('on')};}

$('next').onclick=()=>{$('card').classList.remove('on');mode=null;
  if(!cur.classList.contains('lit')){cur.classList.add('lit');lit++}cur=null;
  if(lit===CH.length)setTimeout(finish,900)};

function finish(){$('stars').style.opacity=0;$('title').classList.add('hide');going=true;
  setTimeout(()=>{$('endtxt').innerHTML='مهما حصل.. لسا برضو بحبك زي أول مرة أشوفك فيها ♡<br><small style="opacity:.8">— محمد</small>';
    $('end').classList.remove('hide');$('end').style.justifyContent='flex-end';$('end').style.paddingBottom='9vh'},4000)}

$('wish').onclick=()=>{for(let i=0;i<90;i++)spawn('burst',W/2,H*.7,true);mode='hearts';
  $('wish').style.display='none';
  $('endtxt').innerHTML='اتمنّيتها ✨<br>11:11 .. وأمنيتي إنتي ♡<br><small style="opacity:.8">كل سنة وإنتي حبيبتي يا جوري — محمد</small>'};
</script>
</body>
</html>
